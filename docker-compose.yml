services:
  postgres:
    image: postgres:16-alpine
    container_name: haydengoseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: medusa
    ports:
      - "5434:5432"
    volumes:
      - haydengoseek_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: haydengoseek-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - haydengoseek_redis_data:/data

volumes:
  haydengoseek_postgres_data:
  haydengoseek_redis_data:
